name: Version Check

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "pyproject.toml"
      - "memory_mapper/__init__.py"

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the packaged version
        id: version
        run: |
          # memory_mapper/__init__.py __version__ is the single source of truth;
          # pyproject.toml reads it dynamically, so installing the package and
          # asking for its metadata resolves the exact version every build ships.
          python -m pip install --upgrade pip
          pip install .
          VERSION="$(python -c 'import importlib.metadata as m; print(m.version("memory-mapper"))')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Packaged version: ${VERSION}"

      - name: Verify release tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${TAG_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match memory_mapper.__version__ (${{ steps.version.outputs.version }}). Bump memory_mapper/__init__.py to ${TAG_VERSION} (or retag) so they agree, then re-publish the release."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches the packaged version ${{ steps.version.outputs.version }}."
