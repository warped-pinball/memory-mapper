name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_extension: deb
            platform_slug: linux-amd64
            executable_name: memory-mapper
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            artifact_extension: deb
            platform_slug: linux-arm64-raspberry-pi
            executable_name: memory-mapper
            deb_arch: arm64
          - os: macos-latest
            artifact_extension: ""
            platform_slug: macos
            executable_name: memory-mapper-macos
          - os: windows-latest
            artifact_extension: exe
            platform_slug: windows
            executable_name: memory-mapper-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build standalone executable
        if: runner.os != 'Linux'
        run: |
          pyinstaller --onefile --name "${{ matrix.executable_name }}" memory_mapper/__main__.py

      # Built inside Debian Bookworm (glibc 2.36) so the binary runs on
      # Raspberry Pi OS Bookworm and newer, rather than requiring the runner's
      # newer glibc. See scripts/build-linux-binary.sh.
      - name: Build standalone executable (Linux, Bookworm glibc)
        if: runner.os == 'Linux'
        run: scripts/build-linux-binary.sh "${{ matrix.executable_name }}"

      - name: Set release filename
        id: release_file
        shell: bash
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          VERSIONED_BASENAME="warped-pinball-memory-mapper-${{ matrix.platform_slug }}-${PACKAGE_VERSION}"
          if [ -n "${{ matrix.artifact_extension }}" ]; then
            RELEASE_FILENAME="${VERSIONED_BASENAME}.${{ matrix.artifact_extension }}"
          else
            RELEASE_FILENAME="${VERSIONED_BASENAME}"
          fi
          echo "release_filename=${RELEASE_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Build Linux .deb package
        if: runner.os == 'Linux'
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin

          {
            echo "Package: memory-mapper"
            echo "Version: ${PACKAGE_VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${{ matrix.deb_arch }}"
            echo "Depends: libc6 (>= 2.36)"
            echo "Maintainer: Memory Mapper Maintainers"
            echo "Description: UDP multicast memory snapshot viewer"
            echo " Standalone CLI tool that displays byte-level memory updates in the terminal."
          } > pkg/DEBIAN/control

          cp dist/${{ matrix.executable_name }} pkg/usr/local/bin/memory-mapper
          chmod 0755 pkg/usr/local/bin/memory-mapper

          dpkg-deb --build pkg "dist/${{ steps.release_file.outputs.release_filename }}"

      - name: Rename non-Linux artifacts for release
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            mv "dist/${{ matrix.executable_name }}.exe" "dist/${{ steps.release_file.outputs.release_filename }}"
          else
            mv "dist/${{ matrix.executable_name }}" "dist/${{ steps.release_file.outputs.release_filename }}"
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.release_file.outputs.release_filename }}
