name: PR Build Comment

# Posts (or updates) a sticky comment on a pull request that links to the
# installer artifacts produced by the "PR Build" workflow.
#
# Uses the `workflow_run` trigger so the comment job runs in the context of
# the base branch with `pull-requests: write` permission, which is required
# for pull requests opened from forks. The build workflow itself only needs
# read permissions.

on:
  workflow_run:
    workflows: ["PR Build"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  comment:
    name: Update sticky PR comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download PR metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(
              fs.readFileSync('number', 'utf8').trim(),
              10,
            );
            const headSha = fs.readFileSync('sha', 'utf8').trim();
            const buildResult = fs.readFileSync('build-result', 'utf8').trim();

            const runId = context.payload.workflow_run.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: artifactsData } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });

            const installerArtifacts = artifactsData.artifacts.filter((a) =>
              a.name.startsWith('warped-pinball-memory-mapper-'),
            );

            const platforms = [
              { slug: 'linux-amd64', label: 'Linux (x86_64 / amd64)' },
              {
                slug: 'linux-arm64-raspberry-pi',
                label: 'Linux (arm64 / Raspberry Pi)',
              },
              { slug: 'macos', label: 'macOS' },
              { slug: 'windows', label: 'Windows' },
            ];

            const rows = platforms.map(({ slug, label }) => {
              const match = installerArtifacts.find((a) =>
                a.name.includes(`-${slug}-`),
              );
              if (!match) {
                return `| ${label} | _unavailable_ | _unavailable_ |`;
              }
              const ghUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${match.id}`;
              const nlUrl = `https://nightly.link/${owner}/${repo}/actions/artifacts/${match.id}.zip`;
              return `| ${label} | [GitHub (sign-in)](${ghUrl}) | [nightly.link](${nlUrl}) |`;
            });

            const overallSucceeded = buildResult === 'success';
            const heading = overallSucceeded
              ? '## PR Build Installers'
              : '## PR Build Installers (some builds failed)';

            const marker = '<!-- pr-build-installers-comment -->';
            const body = [
              marker,
              heading,
              '',
              `Built from commit \`${headSha.substring(0, 7)}\` · ` +
                `[workflow run](https://github.com/${owner}/${repo}/actions/runs/${runId})`,
              '',
              '| Platform | Download (signed-in) | Download (no sign-in) |',
              '| --- | --- | --- |',
              ...rows,
              '',
              '> Each download is a `.zip` containing the platform installer; unzip it before installing.',
              '> "Signed-in" links go to the GitHub Actions artifact page and require a GitHub account with read access to this repo.',
              '> "No sign-in" links are served by [nightly.link](https://nightly.link/) and do not require authentication (public repositories only).',
              '> This comment is updated automatically every time the PR receives a new commit.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
